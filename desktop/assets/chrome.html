<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relay frame</title><link rel="stylesheet" href="chrome.css"><script src="chrome.js" defer></script></head>
<body class="frame"><header aria-label="Relay window controls">
<button id="app-menu-toggle" class="brand" aria-label="Relay menu" aria-haspopup="menu" aria-expanded="false" data-action="menu"><img src="icon.svg" width="20" height="20" alt=""><span>relay<span class="accent">.</span></span><svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4 3 3 3-3"/></svg></button>
<div id="window-drag-region" class="drag-region"><span>YOUR AGENTS, TOGETHER</span></div>
<div class="window-controls"><button aria-label="Minimize window" title="Minimize" data-action="minimize"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg></button><button id="maximize" aria-label="Maximize window" title="Maximize" data-action="maximize"><svg class="maximize-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9"/></svg><svg class="restore-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5v-3h8v8h-3"/><rect x="2.5" y="5.5" width="8" height="8"/></svg></button><button class="close" aria-label="Close window" title="Close" data-action="close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
</header><span id="frame-error" role="status" class="sr-only"></span></body></html>
